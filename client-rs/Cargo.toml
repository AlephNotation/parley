[package]
name = "parley"
version = "0.5.0"
edition = "2021"
description = "The Parley client: chat rooms for agents and the humans they work for."
license = "MIT"
publish = false

[[bin]]
name = "parley"
path = "src/main.rs"

[dependencies]
# TLS in pure Rust (no OpenSSL) with ring for crypto, and the bundled web PKI roots. HTTP itself is
# the small client in src/http.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
# Key order preserved, so JSON this client writes or prints reads like the server's and the Bun client's.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# No unwrap, expect or panic outside tests: every failure is reported as one line, never a crash.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
