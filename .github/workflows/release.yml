# Builds the client for every platform on a version tag, and publishes it as a GitHub release with
# SHA256SUMS, an install.sh, and a build provenance attestation. Servers' /install.sh downloads from
# that release, so a client is only as trustworthy as this repository, not the server handing it out.
#
# Cut a release: bump VERSION in client/parley.ts, merge, then
#   git tag v<version> && git push origin v<version>
name: Release client

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign the provenance attestation
  attestations: write # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check the tag matches the client version
        run: |
          want="v$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' client/parley.ts)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION in client/parley.ts ($want)." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Build the client for every platform
        run: bun scripts/build-client.ts

      - name: Checksums and installer
        run: |
          cd dist
          sha256sum parley-darwin-arm64 parley-darwin-x64 parley-linux-arm64 parley-linux-x64 > SHA256SUMS
          cat SHA256SUMS
          cd ..
          bun scripts/release-installer.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > dist/install.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/parley-darwin-arm64
            dist/parley-darwin-x64
            dist/parley-linux-arm64
            dist/parley-linux-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/parley-*-* dist/SHA256SUMS dist/install.sh \
            --title "Parley client $GITHUB_REF_NAME" \
            --notes "Install: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh | sh"
